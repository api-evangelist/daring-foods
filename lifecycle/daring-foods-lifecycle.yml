source: >-
  Searched daring.com and its subdomains for a versioning policy, deprecation policy, SLA, status
  page and changelog on 2026-08-04; derived the versioning facts from the live route index.
summary: >-
  Daring Foods publishes no API lifecycle commitments of any kind. This is expected and is recorded
  as measured absence, not as a defect the provider hid: the company is a plant-based food brand
  with no developer program, and the REST surface captured in this repo is the incidental output of
  its WordPress CMS. Every field below that is null was searched for and not found.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  owner: WordPress core (not Daring Foods)
  policy_url: null
  detail: >-
    The version namespace belongs to WordPress, advances on WordPress's release schedule, and is
    not something Daring Foods manages or announces. Plugin namespaces on this host version
    independently: oembed/1.0, yoast/v1, redirection/v1, genesisblocks/v1, wpe/cache-plugin/v1,
    wpe_sign_on_plugin/v1, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1.
  stability_risk: >-
    The three collections that carry all the value on this host - `products`, `recipes` and
    `foodservice-products` - are CUSTOM post types registered by the site's theme or a plugin, not
    WordPress core. Their route paths, their presence in /wp/v2/types, and whether they stay
    publicly readable at all are a site-configuration detail that can change with any theme or
    plugin change, silently and without notice. Treat them as unstable.
