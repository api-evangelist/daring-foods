  note: >-
    NO server is published by Daring Foods. The tools below are a CANDIDATE set derived by API
    Evangelist from the 31 verified operations in openapi/, showing what an MCP server over this
    surface would expose. Each tool inherits its real input schema from the backing OpenAPI
    operation's parameters. Nothing here is served by the provider.
rationale: >-
  Worth deriving despite the provider's disinterest: this is a read-only, unauthenticated, well
  paginated catalog of 208 recipes and 21 products, which is close to the ideal shape for an agent
  tool. The two things that would make it genuinely useful - recipe steps and product nutrition -
  are the two things ACF withholds, so a candidate server built on it can find and cite Daring
  content but cannot answer a nutrition or how-do-I-cook-it question without fetching the rendered
  page.
