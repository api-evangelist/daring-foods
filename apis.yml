aid: daring-foods
name: Daring Foods
description: >-
  Daring Foods is an American plant-based food company, founded in 2018 by Ross Mackay and Eliott
  Kessas, that makes 100% plant-based chicken from a deliberately short ingredient list with soy as
  the protein base. Trading simply as "Daring", it sells retail Plant Chicken in shredded, diced and
  breaded-pieces formats plus a line of ready-to-heat Plant Chicken Bowls and Plant Chicken Wings
  through more than 15,000 US grocery stores, and runs a separate foodservice business supplying
  bulk and gluten-free product to restaurants, campus dining and institutional kitchens. The company
  raised over $120 million across 2020-2021 during the plant-based protein boom and was acquired by
  the Australian plant-based meat manufacturer v2food in 2025, under which it retains its own brand.
  Daring Foods is a consumer packaged goods business, not a software vendor: it operates no developer
  program, publishes no product API, and offers no portal, SDKs or developer support. The only
  machine-readable interface it exposes is the WordPress REST content API behind daring.com, which is
  anonymously readable and unusually well-stocked for a CPG site - 208 recipes classified by cooking
  method, 14 retail products, 7 foodservice products, 17 marketing pages and a 749-item media
  library - captured here for discovery purposes.
