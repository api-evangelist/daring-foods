  operations: [listPosts, getPost]
  spec: openapi/daring-foods-posts-api-openapi.yml
  key_fields: [id, slug, title.rendered, content.rendered, excerpt.rendered, author, categories, tags]
  note: Effectively unused - the WordPress install default.
- name: MediaItem
  post_type: attachment
  count: 749
  collection: /wp/v2/media
  operations: [listMedia, getMediaItem]
  spec: openapi/daring-foods-media-api-openapi.yml
