source: >-
  Derived from the schemas and id-reference fields in openapi/daring-foods-*-openapi.yml, from the
  live /wp/v2/types and /wp/v2/taxonomies metadata, and from the `_links` relations returned on
  live records.
summary: >-
  A content graph, not a business-domain graph. Nine entities: three custom content types that
  carry Daring's actual catalog (Product, Recipe, FoodserviceProduct), the two WordPress core
  content types (Page, Post), a shared Media library, a shared Category taxonomy, Comment, and
  User. The interesting shape is that `category` is attached to BOTH `post` and `recipes` and on
  this site holds cooking methods rather than editorial subjects, which makes Recipe -> Category
  the only real classification edge in the model. Every relationship below is an integer id
  reference resolvable through a documented operation.
id_scheme:
  type: integer
  scope: site-wide
  detail: >-
    WordPress uses one auto-incrementing ID space shared across every post type and the media
    library, so a Recipe id and a MediaItem id are drawn from the same sequence and never collide.
    Taxonomy terms and users have their own separate sequences. There are no typed id prefixes.
entities:
- name: Product
  post_type: products
  count: 14
  collection: /wp/v2/products
  operations: [listProducts, getProduct]
  spec: openapi/daring-foods-products-api-openapi.yml
  key_fields: [id, slug, title.rendered, link, date, modified, featured_media, status, type]
  note: Retail plant-chicken catalog. Attribute data (nutrition, ingredients) is in ACF and not exposed.
- name: Recipe
  post_type: recipes
  count: 208
  collection: /wp/v2/recipes
  operations: [listRecipes, getRecipe]
  spec: openapi/daring-foods-recipes-api-openapi.yml
  key_fields: [id, slug, title.rendered, link, date, modified, featured_media, categories, status, type]
  note: The largest collection on the host and the only one with a classification edge.
- name: FoodserviceProduct
  post_type: foodservice-products
