cross_type_index:
  entity: SearchResult
  collection: /wp/v2/search
  operation: searchSiteContent
  note: >-
    Not an entity of its own - a projection over Product, Recipe, FoodserviceProduct, Page and Post
    returning {id, title, url, type, subtype}. `subtype` is the type discriminator that tells a
    consumer which collection to resolve the id against, which makes it the correct entry point
    for keyword-driven traversal of the graph.
gaps:
- >-
  There is NO relationship between Recipe and Product. A recipe does not reference the Daring
  product it uses in any machine-readable field - that association exists only in the rendered
  page body. This is the most consequential missing edge in the model.
- >-
  Product and FoodserviceProduct carry no SKU, GTIN, UPC, price, nutrition, allergen or
  availability field. Everything a food-data consumer would want is in ACF and unexposed.
- >-
  There is no store/retailer entity. The store locator at https://daring.com/locator/ is a
  third-party embed and is not part of this REST surface.
