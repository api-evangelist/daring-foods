  collection: /wp/v2/foodservice-products
  operations: [listFoodserviceProducts, getFoodserviceProduct]
  spec: openapi/daring-foods-foodservice-api-openapi.yml
  key_fields: [id, slug, title.rendered, link, date, modified, featured_media, status, type]
  note: B2B line. Structurally identical to Product; a separate post type, not a Product variant.
- name: Page
  post_type: page
  count: 17
  collection: /wp/v2/pages
  operations: [listPages, getPage]
  spec: openapi/daring-foods-pages-api-openapi.yml
  key_fields: [id, slug, title.rendered, content.rendered, link, parent, menu_order]
  note: The only collection that returns full rendered body content.
- name: Post
  post_type: post
